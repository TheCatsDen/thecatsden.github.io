
<script>
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

let pieces = [];

const bobcatImage = new Image();
bobcatImage.src = "bobcat-head.png";

const growlSound = new Audio("Bobcat%20Growl_Short_2013.wav");
growlSound.volume = 0.45;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

// Play the bobcat growl with each confetti burst.
function playGrowl() {
  const sound = growlSound.cloneNode();
  sound.volume = 0.45;
  sound.play().catch(() => {
    // Browsers may block sound until the visitor interacts.
  });
}

function burst() {
  playGrowl();

  const colors = ["#162960", "#F4B425", "#FADA92"];

  for (let i = 0; i < 180; i++) {
    const isBobcat = Math.random() < 0.25;

    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 150,
      size: isBobcat
        ? 20 + Math.random() * 12
        : 5 + Math.random() * 8,
      bobcat: isBobcat,
      speed: 2 + Math.random() * 4,
      drift: (Math.random() - 0.5) * 3,
      rotation: Math.random() * 360,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];

    p.x += p.drift;
    p.y += p.speed;
    p.rotation += 4;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);

    if (p.bobcat && bobcatImage.complete && bobcatImage.naturalWidth > 0) {
      ctx.drawImage(
        bobcatImage,
        -p.size / 2,
        -p.size / 2,
        p.size,
        p.size
      );
    } else if (!p.bobcat) {
      ctx.fillStyle = p.color;
      ctx.fillRect(
        -p.size / 2,
        -p.size / 2,
        p.size,
        p.size
      );
    }

    ctx.restore();

    if (p.y > canvas.height + 25) {
      pieces.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

// Initial confetti when the website opens.
burst();
animate();
</script>
